<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>韓檢初級考古題</title>
<meta name="theme-color" content="#9B87C9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="韓檢考古題">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: single phone-width column (max 560px); sticky top bar, sticky audio player on listening, fixed bottom question bar.
   Motif: the TOPIK OMR answer sheet — ①②③④ bubbles in the navigator and the score sheet. */
:root {
  --bg: #F7F4FC;          /* page */
  --surface: #FFFFFF;     /* cards */
  --soft: #E9E2F7;        /* light lavender: keyword marks, chips */
  --soft-2: #F1ECFA;      /* quieter fill */
  --primary: #9B87C9;     /* lavender */
  --primary-ink: #6B58A6; /* lavender dark enough for text */
  --on-primary: #FFFFFF;
  --ink: #3E3553;         /* text */
  --ink-2: #7B7091;       /* grey-purple: Chinese lines, captions */
  --line: #E3DCEF;        /* borders */
  --ok: #6BBF8E;  --ok-ink: #2F7D52;  --ok-soft: #E4F4EA;
  --bad: #E58A9A; --bad-ink: #B04A5E; --bad-soft: #FBE7EB;
  --warn: #D9A441;
  --shadow: 0 1px 2px rgba(62,53,83,.06), 0 6px 18px rgba(110,90,166,.08);
  --f-zh: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-ko: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans TC", sans-serif;
  --r-lg: 18px; --r-md: 12px; --r-sm: 8px;
  --bar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18151F; --surface: #221D2D; --soft: #3A3150; --soft-2: #2A2438;
    --primary: #B3A1E3; --primary-ink: #CDBFF2; --on-primary: #1D1729;
    --ink: #EDE8F6; --ink-2: #B0A6C4; --line: #3A3349;
    --ok: #7FD0A1; --ok-ink: #9BE0B7; --ok-soft: #1F3A2B;
    --bad: #F09AA9; --bad-ink: #F6B3BF; --bad-soft: #43242C;
    --warn: #E8BC62;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #18151F; --surface: #221D2D; --soft: #3A3150; --soft-2: #2A2438;
  --primary: #B3A1E3; --primary-ink: #CDBFF2; --on-primary: #1D1729;
  --ink: #EDE8F6; --ink-2: #B0A6C4; --line: #3A3349;
  --ok: #7FD0A1; --ok-ink: #9BE0B7; --ok-soft: #1F3A2B;
  --bad: #F09AA9; --bad-ink: #F6B3BF; --bad-soft: #43242C;
  --warn: #E8BC62;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--ink); font-family: var(--f-zh); font-size: 16px; line-height: 1.6;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
[lang="ko"], .ko { font-family: var(--f-ko); word-break: keep-all; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.num, .tab { font-variant-numeric: tabular-nums; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.fill { fill: currentColor; stroke: none; }

.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.col { max-width: 560px; margin: 0 auto; }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line);
}
.top .col { display: flex; align-items: center; gap: 8px; min-height: 56px; }
.iconbtn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: var(--ink); }
.iconbtn:active { background: var(--soft); }
.top-title { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.top-title b { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-title small { font-size: 12px; color: var(--ink-2); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--soft); color: var(--primary-ink); white-space: nowrap; }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; padding: 4px 10px; border-radius: 10px; background: var(--soft); color: var(--primary-ink); }
.timer.low { background: color-mix(in srgb, var(--warn) 22%, var(--surface)); color: var(--ink); }
.btn-submit { padding: 8px 14px; border-radius: 12px; background: var(--primary); color: var(--on-primary); font-weight: 700; font-size: 14px; }

/* ---------- generic ---------- */
main.wrap { padding-block: 16px 32px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 14px; font-weight: 700; font-size: 15px; }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.ghost { background: var(--soft); color: var(--primary-ink); }
.btn.line { border: 1.5px solid var(--line); background: var(--surface); }
.btn.block { width: 100%; }
.btn:active { transform: scale(.98); }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.spacer { flex: 1; }

/* ---------- home ---------- */
.hello { padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-family: var(--f-ko); font-size: 13px; letter-spacing: .08em; color: var(--primary-ink); font-weight: 500; }
.hello h1 { font-size: 28px; line-height: 1.25; font-weight: 700; }
.hello .lead { color: var(--ink-2); font-size: 15px; }
.sheet-mark { display: flex; gap: 6px; margin-top: 6px; }
.sheet-mark i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--primary); }
.sheet-mark i.on { background: var(--primary); }

.wb-link { display: flex; align-items: center; gap: 12px; padding: 14px 16px; text-align: left; width: 100%; }
.wb-link .badge { min-width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--bad-soft); color: var(--bad-ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.wb-link b { display: block; font-size: 16px; }
.wb-link span.sub { font-size: 13px; color: var(--ink-2); }

.year { font-size: 14px; font-weight: 700; color: var(--ink-2); letter-spacing: .06em; display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.year::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.session-card { display: block; width: 100%; text-align: left; padding: 16px; }
.sc-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.sc-title { font-size: 20px; font-weight: 700; }
.sc-date { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.sc-go { margin-left: auto; color: var(--primary-ink); }
.sc-rows { display: flex; flex-direction: column; gap: 10px; }
.sc-row { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
.sc-sec { font-weight: 700; }
.bar { height: 8px; border-radius: 99px; background: var(--soft-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--primary); }
.sc-meta { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.sc-meta b { color: var(--ink); }
.sc-total { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); display: flex; align-items: center; gap: 8px; font-size: 14px; }
.level { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 8px; font-weight: 700; font-size: 13px; }
.level.l2 { background: var(--primary); color: var(--on-primary); }
.level.l1 { background: var(--soft); color: var(--primary-ink); }
.level.l0 { background: var(--soft-2); color: var(--ink-2); }
.foot { font-size: 12px; color: var(--ink-2); display: flex; flex-direction: column; gap: 8px; padding-top: 8px; }
.linkbtn { color: var(--primary-ink); text-decoration: underline; text-underline-offset: 3px; font-size: 13px; align-self: flex-start; }

/* ---------- session ---------- */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--soft-2); border-radius: 14px; }
.seg button { min-height: 44px; border-radius: 11px; font-weight: 700; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--primary-ink); box-shadow: var(--shadow); }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; padding: 14px 8px; }
.facts div { display: flex; flex-direction: column; }
.facts b { font-size: 20px; font-variant-numeric: tabular-nums; }
.facts span { font-size: 12px; color: var(--ink-2); }
.mode { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.mode h3 { font-size: 18px; display: flex; align-items: center; gap: 8px; }
.mode p { color: var(--ink-2); font-size: 14px; }
.mode .prog { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); }
.mode .prog .bar { flex: 1; }
.hist { padding: 6px 16px; }
.hist-item { display: flex; align-items: center; gap: 10px; padding: 12px 0; width: 100%; text-align: left; border-bottom: 1px solid var(--line); font-size: 14px; }
.hist-item:last-child { border-bottom: 0; }
.hist-item .sc { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
.section-title { font-size: 15px; font-weight: 700; color: var(--ink-2); }

/* ---------- audio player ---------- */
.player {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 57px); z-index: 15;
  background: var(--bg); padding-block: 8px;
}
.player .box { background: var(--surface); border: 1.5px solid var(--soft); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 10px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; }
.pp { width: 56px; height: 56px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; grid-row: span 2; box-shadow: 0 4px 12px color-mix(in srgb, var(--primary) 45%, transparent); }
.pp svg.i { width: 26px; height: 26px; }
.pp:active { transform: scale(.95); }
.pmeta { min-width: 0; display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
.pmeta b { font-size: 14px; white-space: nowrap; }
.pmeta .ptime { margin-left: auto; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.replay { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; color: var(--primary-ink); padding: 6px 10px; border-radius: 10px; background: var(--soft); grid-row: 1; grid-column: 3; }
.seek { width: 100%; grid-column: 2 / 4; height: 28px; margin: 0; -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; --p: 0%; }
.seek::-webkit-slider-runnable-track { height: 6px; border-radius: 99px; background: linear-gradient(to right, var(--primary) var(--p), var(--soft) var(--p)); }
.seek::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--primary); margin-top: -6px; border: 3px solid var(--surface); box-shadow: 0 1px 4px rgba(62,53,83,.25); }
.seek::-moz-range-track { height: 6px; border-radius: 99px; background: var(--soft); }
.seek::-moz-range-progress { height: 6px; border-radius: 99px; background: var(--primary); }
.seek::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--primary); border: 3px solid var(--surface); }
.speeds { grid-column: 1 / 4; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); padding-top: 2px; }
.speeds button { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; font-weight: 500; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.speeds button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.speeds { flex-wrap: wrap; }
.speeds .autotog { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px 3px 8px; }
.speeds .autotog svg.i { width: 14px; height: 14px; }
.speeds .autotog[aria-pressed="true"] { background: var(--soft); border-color: var(--soft); color: var(--primary-ink); }
.speeds .autotog[aria-pressed="false"] svg.i { opacity: 0; width: 0; margin-left: -4px; }

/* ---------- question ---------- */
.quiz { padding-bottom: calc(var(--bar-h) + 40px + env(safe-area-inset-bottom, 0px)); }
.ins { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; background: var(--soft-2); border-radius: var(--r-lg); }
.ins .ko { font-weight: 700; font-size: 15px; line-height: 1.55; }
.ins .ko u { text-underline-offset: 3px; }
.ins .zh { font-size: 13px; color: var(--ink-2); }
.ins .range { font-family: var(--f-ko); font-weight: 700; color: var(--primary-ink); margin-right: 4px; }
.ex-toggle { align-self: flex-start; font-size: 13px; color: var(--primary-ink); font-weight: 500; display: inline-flex; align-items: center; gap: 4px; padding: 4px 0; }
.example { margin-top: 4px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); padding: 12px 14px; position: relative; }
.example .lbl { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--surface); padding: 0 8px; font-family: var(--f-ko); font-size: 13px; color: var(--ink-2); }
.example .lines { font-weight: 700; display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; font-size: 15px; }
.example .eo { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; font-size: 14px; }
.example .eo .on { font-weight: 700; color: var(--primary-ink); }

.qcard { padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; }
.qhead { display: flex; align-items: center; gap: 10px; }
.qno { font-size: 26px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; color: var(--primary-ink); }
.qhead .pts { font-size: 13px; color: var(--ink-2); padding: 2px 8px; border: 1px solid var(--line); border-radius: 8px; }
.qhead .grp { font-size: 12px; color: var(--ink-2); margin-left: auto; }
.stem { font-family: var(--f-ko); font-weight: 700; font-size: 17px; line-height: 1.55; }
.stem-zh { font-size: 13px; color: var(--ink-2); margin-top: -8px; }
.passage { font-family: var(--f-ko); font-size: 17px; line-height: 1.9; border: 1.5px solid var(--ink); border-radius: 4px; padding: 12px 14px; white-space: pre-line; word-break: keep-all; overflow-wrap: anywhere; }
.passage.indent { text-indent: 1em; }
.passage.tight { line-height: 1.75; }
.blank { display: inline-block; min-width: 3.2em; text-align: center; border-bottom: 2px solid var(--primary); color: var(--primary-ink); font-weight: 700; text-indent: 0; line-height: 1.4; }
.figure { display: block; width: 100%; padding: 0; border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--line); background: #fff; position: relative; }
.figure img { display: block; width: 100%; height: auto; }
.zoom-hint { position: absolute; right: 8px; bottom: 8px; background: rgba(62,53,83,.72); color: #fff; font-size: 12px; padding: 3px 8px; border-radius: 8px; display: inline-flex; gap: 4px; align-items: center; }
.zoom-hint svg.i { width: 14px; height: 14px; }

.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 58px; padding: 12px 14px; text-align: left; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); font-family: var(--f-ko); font-size: 17px; line-height: 1.45; transition: background .15s, border-color .15s; }
.opt .n { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--primary); color: var(--primary-ink); font-family: var(--f-zh); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.opt .t { flex: 1; min-width: 0; }
.opt .mk { flex: none; width: 24px; height: 24px; }
.opt:not([disabled]):active { background: var(--soft-2); }
.opt.sel { border-color: var(--primary); background: var(--soft); }
.opt.sel .n { background: var(--primary); color: var(--on-primary); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .n { background: var(--ok); border-color: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .n { background: var(--bad); border-color: var(--bad); color: #fff; }
.opt.dim { opacity: .55; }
.opt[disabled] { cursor: default; }
.opts.pics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt-pic { position: relative; border: 2px solid var(--line); border-radius: 14px; overflow: hidden; background: #fff; padding: 0; }
.opt-pic img { display: block; width: 100%; height: auto; }
.opt-pic .n { position: absolute; left: 6px; top: 6px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1.5px solid var(--primary); color: var(--primary-ink); font-weight: 700; font-size: 14px; }
.opt-pic.sel { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 35%, transparent); }
.opt-pic.sel .n { background: var(--primary); color: var(--on-primary); }
.opt-pic.right { border-color: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 40%, transparent); }
.opt-pic.right .n { background: var(--ok); border-color: var(--ok); color: #fff; }
.opt-pic.wrong { border-color: var(--bad); }
.opt-pic.wrong .n { background: var(--bad); border-color: var(--bad); color: #fff; }
.opt-pic.dim { opacity: .55; }
.hint-tap { font-size: 13px; color: var(--ink-2); text-align: center; }

/* ---------- explanation ---------- */
.expl { padding: 18px 16px; display: flex; flex-direction: column; gap: 18px; scroll-margin-top: 76px; }
.with-player .expl { scroll-margin-top: 214px; }
.verdict { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 14px; border-radius: var(--r-md); font-size: 15px; }
.verdict.ok { background: var(--ok-soft); }
.verdict.bad { background: var(--bad-soft); }
.verdict.none { background: var(--soft-2); }
.verdict .big { font-size: 17px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; width: 100%; }
.verdict.ok .big { color: var(--ok-ink); }
.verdict.bad .big { color: var(--bad-ink); }
.verdict .kv b { font-size: 17px; }
.verdict .kv.ans b { color: var(--ok-ink); }
.verdict .kv.mine b { color: var(--bad-ink); }
.h3 { font-size: 15px; font-weight: 700; display: flex; align-items: baseline; gap: 8px; color: var(--ink); }
.h3::before { content: ""; width: 4px; height: 14px; border-radius: 2px; background: var(--primary); align-self: center; }
.h3 small { font-weight: 400; color: var(--ink-2); font-size: 12px; }
.pairs { display: flex; flex-direction: column; gap: 12px; }
.pair { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.pair.turn { margin-top: 6px; }
.pair .spk { font-size: 12px; font-weight: 700; color: var(--primary-ink); background: var(--soft); border-radius: 6px; padding: 1px 8px; white-space: nowrap; font-family: var(--f-ko); }
.pair .body { min-width: 0; width: 100%; }
.pair .k { font-family: var(--f-ko); font-size: 17px; line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere; }
.pair .z { font-size: 14px; color: var(--ink-2); line-height: 1.6; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--primary) 70%, transparent); text-decoration-thickness: 1.5px; text-underline-offset: 4px; margin-top: 2px; }
.ansline { font-size: 11px; font-weight: 700; color: var(--ok-ink); background: var(--ok-soft); border-radius: 6px; padding: 0 6px; margin-left: 6px; vertical-align: 2px; font-family: var(--f-zh); }
mark.kw { background: var(--soft); color: inherit; border-radius: 4px; padding: 0 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.fill { color: var(--primary-ink); font-weight: 700; border-bottom: 2px dashed var(--primary); }
.optpairs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }

    let i = 0;
    while ((i = plain.indexOf(f, i)) >= 0) {
      if (f.length === 1 && i > 0 && !BOUND.test(plain[i - 1])) { i += 1; continue; }
      let free = true;
      for (let k = i; k < i + f.length; k++) if (owner[k]) { free = false; break; }
      if (free) { id++; for (let k = i; k < i + f.length; k++) owner[k] = id; }
      i += f.length;
    }
  }
  const seg = (a, b) => {
    let out = "", k = a;
    while (k < b) {
      let j = k;
      while (j < b && owner[j] === owner[k] && fill[j] === fill[k]) j++;
      let piece = esc(plain.slice(k, j));
      if (owner[k]) piece = '<mark class="kw">' + piece + "</mark>";
      if (fill[k]) piece = '<span class="fill">' + piece + "</span>";
      out += piece; k = j;
    }
    return out;
  };
  return '<div class="gl" lang="ko">' + toks.map(([a, b], k) =>
    '<span class="w"><span class="wk">' + seg(a, b) + '</span><span class="wz" lang="zh-Hant">' + esc(gloss[k]) + "</span></span>").join("") + "</div>";
}
function passageHTML(text) {
  return esc(text).replace(/\(([　\s]*)(㉠|㉡|㉢|㉣)?([　\s]*)\)/g, (m, a, c) => '<span class="blank">' + (c || "&nbsp;") + "</span>");
}

/* ===================== ATTEMPT ===================== */
function startAttempt(sid, sec, mode, fresh) {
  const b = DATA.banks[sid];
  const key = sid + "-" + sec + "-" + mode;
  if (fresh) delete store.progress[key];
  let p = store.progress[key];
  if (!p) {
    p = { answers: {}, idx: 0, startedAt: Date.now() };
    if (mode === "mock") p.deadline = Date.now() + b.sections[sec].minutes * 60000;
    store.progress[key] = p;
    save();
  }
  A = Object.assign({ key, sid, sec, mode, finished: false }, JSON.parse(JSON.stringify(p)));
  go({ name: "quiz" });
}
function persistA() {
  if (!A || A.finished) return;
  store.progress[A.key] = { answers: A.answers, idx: A.idx, startedAt: A.startedAt, deadline: A.deadline };
  save();
}
function scoreOf(b, sec, answers) {
  let score = 0, correct = 0;
  for (const q of b.sec[sec]) if (answers[q.number] === q.answer) { score += q.points; correct++; }
  return { score, correct };
}
function submitAttempt(b, att, silent) {
  const qs = b.sec[att.sec];
  const { score, correct } = scoreOf(b, att.sec, att.answers);
  const total = qs.reduce((a, q) => a + q.points, 0);
  const rec = { date: Date.now(), mode: att.mode, score, correct, count: qs.length, total, answers: att.answers,
    used: att.startedAt ? Math.round((Math.min(Date.now(), att.deadline || Infinity) - att.startedAt) / 1000) : null };
  const k = b.id + "-" + att.sec;
  (store.results[k] = store.results[k] || []).push(rec);
  if (store.results[k].length > 20) store.results[k].splice(0, store.results[k].length - 20);
  if (att.mode === "mock") {
    for (const q of qs) {
      if (att.answers[q.number] !== q.answer) store.wrong[q.id] = { at: Date.now() };
      else delete store.wrong[q.id];
    }
  }
  delete store.progress[att.key];
  save();
  return store.results[k].length - 1;
}

  }

      fz.lines.map(l => l.speaker ? '<p class="dl"><b class="fz-spk">' + esc(l.speaker) + "：</b><span>" + esc(l.zh) + "</span></p>" : "<p>" + esc(l.zh) + "</p>").join("") + "</div>";
  }
  // options
  h += '<h3 class="h3">選項對照</h3><ol class="optpairs">';

    const say = op.ko && speakable(op.ko) ? sayBtn(op.ko) : "";
    h += '<li class="' + cls + '"><span class="n">' + n + '</span><div class="ocol">' + pic + ko + (og ? '<p class="zf">' : '<p class="z">') + esc(op.zh) + '</p></div><div class="side">' + tag + say + "</div></li>";

  h += "</ol>";
  // analysis
  h += '<h3 class="h3">解題說明</h3><div class="analysis">' +
    String(q.explanation.analysis || "").split("\n").filter(Boolean).map(line =>
      line.startsWith("＊") ? '<p class="tip">' + esc(line.slice(1)) + "</p>" : "<p>" + esc(line) + "</p>").join("") + "</div>";

  const voc = vocabFor(b, q);

    voc.map(v => '<li>' + sayBtn(v.say || v.word) + '<span class="w" lang="ko">' + esc(v.display).replace(/\(([^)]*[一-鿿][^)]*)\)/g, '<span class="hj">($1)</span>') + '</span><span class="pos">' + esc(v.pos) + '</span><span class="m">' + esc(v.zh) + "</span></li>").join("") +
    "</ul>";
  h += "</section>";
  return h;
}

/* ===================== KOREAN PRONUNCIATION (speech synthesis) ===================== */
const TTS = { voice: null, warned: false, btn: null, count: 0 };
function pickVoice() {
  try {
    const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    const ko = vs.filter(v => /^ko([-_]|$)/i.test(v.lang || ""));
    TTS.voice = ko.find(v => /google/i.test(v.name)) || ko.find(v => /yuna|sora|heami|sunhi|injoon/i.test(v.name)) || ko[0] || null;
    TTS.count = vs.length;
  } catch (e) { TTS.voice = null; }
}
try { if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } } catch (e) {}
function speakable(t) {
  if (!/[가-힣]/.test(t)) return false;
  return !/^\([가-라]\)(\s*[-–]\s*\([가-라]\))+$/.test(t.trim());
}
function readBtn(text, label) {
  return '<button class="readbtn" data-act="say" data-say="' + esc(text) + '" aria-label="' + esc(label) + '（韓文發音）">' + ICON.speaker + "<span>" + esc(label) + "</span></button>";
}
function sayBtn(text) {
  return '<button class="say" data-act="say" data-say="' + esc(text) + '" aria-label="播放韓文發音：' + esc(text) + '">' + ICON.speaker + "</button>";
}
function ttsClean(t) {
  return String(t)
    .replace(/\{\{|\}\}/g, "")
    .replace(/\(([　\s]*)(㉠|㉡|㉢|㉣)?([　\s]*)\)/g, " … ")
    .replace(/㉠/g, "기역").replace(/㉡/g, "니은").replace(/㉢/g, "디귿").replace(/㉣/g, "리을")
    .replace(/(\d{4})\.(\d{1,2})\.(\d{1,2})\.?/g, "$1년 $2월 $3일 ")
    .replace(/\b(\d{1,2})\/(\d{1,2})\b/g, "$1월 $2일")
    .replace(/\b0?(\d{1,2}):(\d{2})\b/g, (m, h, mm) => h + "시" + (mm === "00" ? "" : " " + String(+mm) + "분"))
    .replace(/\((월|화|수|목|금|토|일)\)/g, " $1요일")
    .replace(/(^|[\s:])(월|화|수|목|금|토|일)~(월|화|수|목|금|토|일)(?=\s|$)/g, "$1$2요일부터 $3요일까지")
    .replace(/~/g, "부터 ")
    .replace(/→/g, ", ")
    .replace(/[▶☁☂☀※]/g, "")
    .replace(/[ \t　]+/g, " ").trim()
    .replace(/^[…,\s]+/, "").replace(/\s+([.,!?])/g, "$1");
}
function ttsParts(t) {
  return String(t).split(/\n+/).flatMap(line => line.split(/(?<=[.!?])\s+/)).map(ttsClean).filter(x => /[가-힣0-9]/.test(x));
}
function speak(text, btn) {
  if (!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === "undefined") { toast("這個瀏覽器不支援韓文語音朗讀"); return; }
  try {
    if (btn && TTS.btn === btn && btn.classList.contains("speaking")) { stopSpeech(); return; }   // second tap stops
    stopAudio();
    stopSpeech();
    if (!TTS.voice) pickVoice();
    const parts = ttsParts(text);
    if (!parts.length) return;
    const seq = (TTS.seq = (TTS.seq || 0) + 1);
    TTS.btn = btn || null;
    if (btn) btn.classList.add("speaking");
    const finish = () => { if (TTS.seq === seq && btn) { btn.classList.remove("speaking"); TTS.btn = null; } };
    parts.forEach((t, i) => {
      const u = new SpeechSynthesisUtterance(t);
      u.lang = "ko-KR";
      if (TTS.voice) u.voice = TTS.voice;
      u.rate = 0.9;
      u.onerror = finish;
      if (i === parts.length - 1) u.onend = finish;
      speechSynthesis.speak(u);
    });
    if (!TTS.voice && TTS.count > 0 && !TTS.warned) {
      TTS.warned = true;
      toast("這台裝置沒有韓文語音，發音可能不正確。可以在系統設定的「語音」加入韓文。");
    }
  } catch (e) { toast("無法播放發音"); }
}
function stopSpeech() {
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
  if (TTS.btn) { TTS.btn.classList.remove("speaking"); TTS.btn = null; }
  TTS.seq = (TTS.seq || 0) + 1;
}

let audioSrc = null;
function playerHTML(b, q) {
  if (!q.audio) return "";
  const shared = q.shared ? b.shared[q.shared] : null;
  const title = shared ? "第 " + shared.range + " 題" : "第 " + q.number + " 題";

    '<button class="pp" id="pp" aria-label="播放">' + ICON.play + "</button>" +

    '<button class="replay" id="replay" aria-label="重播本題">' + ICON.replay + "重播</button>" +

    '<div class="speeds"><span>速度</span>' + SPEEDS.map(s => '<button data-speed="' + s + '" aria-pressed="' + (s === getSpeed()) + '">' + s + "x</button>").join("") +
    '<button class="autotog" id="autotog" aria-pressed="' + getAuto() + '" aria-label="切換到題目時自動播放">' + ICON.check.replace('class="i"', 'class="i" style="stroke-width:3"') + "自動播放</button></div>" +
    "</div></div></div>";
}
function getAuto() { try { const v = localStorage.getItem(STORE_KEY + "-autoplay"); return v === null ? true : v === "1"; } catch (e) { return AUTO_MEM; } }
function setAuto(on) { AUTO_MEM = on; try { localStorage.setItem(STORE_KEY + "-autoplay", on ? "1" : "0"); } catch (e) {} }
let AUTO_MEM = true;
let autoplayPending = false; // set when the user arrives at a question; consumed by the next bindPlayer()
function getSpeed() { try { const s = +localStorage.getItem(STORE_KEY + "-speed"); if (SPEEDS.includes(s)) return s; } catch (e) {} return 1; }
function setSpeed(s) { try { localStorage.setItem(STORE_KEY + "-speed", String(s)); } catch (e) {} audio.playbackRate = s; }
function bindPlayer(b, q) {
  const pp = document.getElementById("pp");
  if (!pp || !q.audio) { return; }
  const src = b.base + q.audio.file;
  const isNew = audioSrc !== src;
  if (isNew) {
    audio.pause();
    audio.src = src;
    audioSrc = src;
    audio.load();
  }
  audio.playbackRate = getSpeed();
  const arrive = autoplayPending;
  autoplayPending = false;
  if (arrive && getAuto() && (isNew || audio.paused)) {
    // Same group audio already playing (e.g. 25 → 26) keeps going; otherwise start this question's audio from the top.
    if (!isNew) audio.currentTime = 0;
    stopSpeech();
    const pr = audio.play();
    if (pr && pr.catch) pr.catch(() => {});
  }
  const seek = document.getElementById("seek"), ptime = document.getElementById("ptime");
  let dragging = false;
  const sync = () => {
    pp.innerHTML = audio.paused ? ICON.play : ICON.pause;
    pp.setAttribute("aria-label", audio.paused ? "播放" : "暫停");
    const d = audio.duration;
    if (!dragging && isFinite(d) && d > 0) seek.value = Math.round(1000 * audio.currentTime / d);
    seek.style.setProperty("--p", (seek.value / 10) + "%");
    ptime.textContent = fmtTime(audio.currentTime) + " / " + (isFinite(d) ? fmtTime(d) : "--:--");
  };
  audio.ontimeupdate = sync; audio.onplay = sync; audio.onpause = sync; audio.onloadedmetadata = sync; audio.onended = sync;
  audio.onerror = () => { ptime.textContent = "音檔載入失敗"; };
  pp.onclick = () => { if (audio.paused) { stopSpeech(); const pr = audio.play(); if (pr && pr.catch) pr.catch(() => toast("無法播放音檔，請再按一次")); } else audio.pause(); };
  document.getElementById("replay").onclick = () => { stopSpeech(); audio.currentTime = 0; const pr = audio.play(); if (pr && pr.catch) pr.catch(() => {}); };
  seek.oninput = () => { dragging = true; seek.style.setProperty("--p", (seek.value / 10) + "%"); const d = audio.duration; if (isFinite(d)) ptime.textContent = fmtTime(d * seek.value / 1000) + " / " + fmtTime(d); };
  seek.onchange = () => { const d = audio.duration; if (isFinite(d)) audio.currentTime = d * seek.value / 1000; dragging = false; };
  const tog = document.getElementById("autotog");
  if (tog) tog.onclick = () => {
    const on = !getAuto(); setAuto(on);
    tog.setAttribute("aria-pressed", String(on));
    toast(on ? "已開啟：切換題目時自動播放" : "已關閉自動播放");
  };
  document.querySelectorAll(".speeds [data-speed]").forEach(btn => btn.onclick = () => {
    setSpeed(+btn.dataset.speed);
    document.querySelectorAll(".speeds [data-speed]").forEach(x => x.setAttribute("aria-pressed", String(x === btn)));
  });
  sync();
}
function stopAudio() { try { audio.pause(); } catch (e) {} }

function wrongGroups() {
  const groups = {};

    const m = /^(\d+)-([LR])-(\d+)$/.exec(id);
    if (!m) continue;
    const k = m[1] + "-" + (m[2] === "L" ? "listening" : "reading");
    (groups[k] = groups[k] || []).push(+m[3]);
  }
  for (const k in groups) groups[k].sort((a, b) => a - b);
  return groups;
}

}

}

/* ===================== overlays ===================== */
function closeOverlays() { document.querySelectorAll(".overlay,.zoom").forEach(x => x.remove()); }
function sheet(inner) {
  closeOverlays();
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = '<div class="sheet" role="dialog" aria-modal="true"><span class="grabber"></span>' + inner + "</div>";
  ov.addEventListener("click", e => { if (e.target === ov) ov.remove(); });
  document.body.appendChild(ov);
  return ov;
}
function gridSheet() {
  let list, cur, stateOf;
  if (route.name === "quiz") {
    const b = DATA.banks[A.sid]; list = b.sec[A.sec].map(q => q.number); cur = A.idx;
    stateOf = n => {
      const a = A.answers[n]; if (a == null) return ["", ""];
      if (A.mode === "practice") return [a === b.byNum[n].answer ? "right" : "wrong", CIRC[a - 1]];
      return ["ans", CIRC[a - 1]];
    };
  } else if (route.name === "review") {
    const b = DATA.banks[RV.sid]; list = RV.list; cur = RV.i;
    stateOf = n => { const a = RV.answers[n]; return [a === b.byNum[n].answer ? "right" : "wrong", a ? CIRC[a - 1] : "—"]; };
  } else {
    const b = DATA.banks[WQ.sid]; list = WQ.list; cur = WQ.i;
    stateOf = n => { const a = WQ.answers[n]; if (a == null) return ["", ""]; return [a === b.byNum[n].answer ? "right" : "wrong", CIRC[a - 1]]; };
  }
  const answered = list.filter(n => stateOf(n)[0]).length;
  let h = '<div class="row"><h3>題號總覽</h3><span class="spacer"></span><span class="muted small tab">已答 ' + answered + " / " + list.length + "</span></div>";
  h += '<div class="numgrid">' + list.map((n, i) => { const [c, sub] = stateOf(n); return '<button class="' + c + (i === cur ? " cur" : "") + '" data-act="jump" data-i="' + i + '"><span>' + n + "</span><small>" + (sub || "&nbsp;") + "</small></button>"; }).join("") + "</div>";
  const mockLegend = route.name === "quiz" && A.mode === "mock";
  h += '<div class="legend">' + (mockLegend ? '<span><i class="ans"></i>已作答</span><span><i></i>未作答</span>' : '<span><i class="right"></i>答對</span><span><i class="wrong"></i>答錯</span><span><i></i>未作答</span>') + "</div>";
  sheet(h);
}
function askSubmit() {
  const b = DATA.banks[A.sid];
  const qs = b.sec[A.sec];
  const un = qs.filter(q => A.answers[q.number] == null).map(q => q.number);
  sheet('<h3>確定要交卷嗎？</h3><p class="muted">' + (un.length ? "還有 " + un.length + " 題未作答：<span class='tab'>" + un.slice(0, 12).join("、") + (un.length > 12 ? "…" : "") + "</span>" : "所有題目都作答了。") + "</p>" +
    '<div class="acts"><button class="btn primary block" data-act="submit">交卷，看成績</button><button class="btn line block" data-act="close-sheet">繼續作答</button></div>');
}
function askLeave() {
  sheet('<h3>先離開嗎？</h3><p class="muted">' + (A.mode === "mock" ? "作答進度會保留，但模擬考的計時不會暫停。" : "作答進度會保留，下次可以從這一題繼續。") + "</p>" +
    '<div class="acts"><button class="btn primary block" data-act="leave-confirm">離開</button><button class="btn line block" data-act="close-sheet">留在這裡</button></div>');
}
function zoom(src) {
  closeOverlays();
  const z = document.createElement("div");
  z.className = "zoom fit";
  z.innerHTML = '<img src="' + esc(src) + '" alt="放大圖片"><button class="close" aria-label="關閉">' + ICON.cross + "</button>";
  z.addEventListener("click", e => {
    if (e.target.closest(".close")) { z.remove(); return; }
    if (e.target.tagName === "IMG") { z.classList.toggle("fit"); return; }
    z.remove();
  });
  document.body.appendChild(z);
}
let toastT = null;
function toast(msg) {
  document.querySelectorAll(".toast").forEach(x => x.remove());
  const t = document.createElement("div");
  t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2400);
}

/* ===================== actions ===================== */
document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  try {
    switch (act) {
      case "home": A = null; go({ name: "home" }); break;
      case "open-session": {
        const sid = el.dataset.sid;
        $app.innerHTML = '<div class="loading">載入題庫中…</div>';
        await loadBank(sid);
        go({ name: "session", sid });
        break;
      }
      case "tab": sessTab[route.sid] = el.dataset.sec; render(); break;
      case "start": startAttempt(route.sid, sessTab[route.sid] || "listening", el.dataset.mode, false); break;
      case "restart": {
        const mode = el.dataset.mode;
        sheet('<h3>重新開始' + modeLabel(mode) + '？</h3><p class="muted">目前這次的作答進度會清除（已完成的成績紀錄不受影響）。</p><div class="acts"><button class="btn primary block" data-act="restart-confirm" data-mode="' + mode + '">清除並重新開始</button><button class="btn line block" data-act="close-sheet">取消</button></div>');
        break;
      }
      case "restart-confirm": closeOverlays(); startAttempt(route.sid, sessTab[route.sid] || "listening", el.dataset.mode, true); break;
      case "again": { const sid = route.sid, sec = route.sec; sessTab[sid] = sec; route = { name: "session", sid }; startAttempt(sid, sec, el.dataset.mode, true); break; }
      case "say": speak(el.dataset.say, el); break;
      case "choose": onChoose(+el.dataset.n); break;
      case "prev": move(-1); break;
      case "next": move(1); break;
      case "grid": gridSheet(); break;
      case "jump": closeOverlays(); jump(+el.dataset.i); break;
      case "toggle-ex": openExample[el.dataset.ins] = !openExample[el.dataset.ins]; rerenderKeepScroll(); break;
      case "zoom": zoom(el.dataset.src); break;
      case "ask-submit": askSubmit(); break;
      case "submit": {
        closeOverlays();
        const b = DATA.banks[A.sid];
        const ri = submitAttempt(b, A, false);
        const sid = A.sid, sec = A.sec; A = null; stopAudio();
        go({ name: "result", sid, sec, ri });
        break;
      }
      case "close-sheet": closeOverlays(); break;
      case "leave-quiz": if (A && !A.finished && !A.finishedInfo) askLeave(); else { const sid = A.sid; A = null; go({ name: "session", sid }); } break;
      case "leave-confirm": { closeOverlays(); persistA(); const sid = A.sid; A = null; go({ name: "session", sid }); break; }
      case "open-result-direct": { const f = A.finishedInfo; const sid = A.sid, sec = A.sec; A = null; go({ name: "result", sid, sec, ri: f.ri }); break; }
      case "open-result": go({ name: "result", sid: route.sid, sec: el.dataset.sec, ri: +el.dataset.ri }); break;
      case "to-session": sessTab[route.sid] = route.sec; go({ name: "session", sid: route.sid }); break;
      case "review-all": case "review-wrong": case "review-one": {
        const b = DATA.banks[route.sid];
        const r = store.results[b.id + "-" + route.sec][route.ri];
        let list = b.sec[route.sec].map(q => q.number);
        if (act === "review-wrong") list = list.filter(n => r.answers[n] !== b.byNum[n].answer);
        const i = act === "review-one" ? list.indexOf(+el.dataset.n) : 0;
        RV = { sid: b.id, sec: route.sec, ri: route.ri, answers: r.answers, list, i: Math.max(0, i), onlyWrong: act === "review-wrong" };
        go({ name: "review" });
        break;
      }
      case "back-from-review": go({ name: "result", sid: RV.sid, sec: RV.sec, ri: RV.ri }); break;
      case "wrongbook": route = { name: "wrongbook" }; stopAudio(); $app.innerHTML = '<div class="loading">載入中…</div>'; await renderWrongbookAsync(); window.scrollTo(0, 0); break;
      case "wb-all": case "wb-one": {
        const [sid, sec] = el.dataset.k.split("-");
        if (!DATA.banks[sid]) await loadBank(sid);
        const list = wrongGroups()[el.dataset.k] || [];
        WQ = { sid, sec, list, i: act === "wb-one" ? Math.max(0, list.indexOf(+el.dataset.n)) : 0, answers: {} };
        go({ name: "wrongq" });
        break;
      }
      case "reset":
        sheet('<h3>清除所有作答紀錄？</h3><p class="muted">進度、成績與錯題本都會刪除，無法復原。</p><div class="acts"><button class="btn primary block" data-act="reset-confirm">全部清除</button><button class="btn line block" data-act="close-sheet">取消</button></div>');
        break;
      case "reset-confirm":
        store = { v: 1, progress: {}, results: {}, wrong: {} }; save(); closeOverlays(); go({ name: "home" }); toast("已清除作答紀錄"); break;
    }
  } catch (err) {
    console.error(err);
    toast("發生錯誤：" + (err && err.message ? err.message : err));
  }
});

function rerenderKeepScroll() { const y = window.scrollY; render(); window.scrollTo(0, y); }

function onChoose(n) {
  if (route.name === "quiz") {
    const b = DATA.banks[A.sid];
    const q = curQ();
    if (A.mode === "practice") {
      if (A.answers[q.number] != null) return;
      A.answers[q.number] = n;
      if (n !== q.answer) store.wrong[q.id] = { at: Date.now() };
      else if (store.wrong[q.id]) delete store.wrong[q.id];
      const qs = b.sec[A.sec];
      if (qs.every(x => A.answers[x.number] != null)) {
        const ri = submitAttempt(b, A, false);
        const sc = scoreOf(b, A.sec, A.answers);
        A.finished = true;
        A.finishedInfo = { ri, score: sc.score, correct: sc.correct, count: qs.length, total: qs.reduce((a, x) => a + x.points, 0) };
      } else persistA();
      save();
      const y = window.scrollY;
      render();
      window.scrollTo(0, y);
      const ex = document.getElementById("expl");
      if (ex) setTimeout(() => ex.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }), 60);
    } else {
      A.answers[q.number] = n;
      persistA();
      rerenderKeepScroll();
    }
  } else if (route.name === "wrongq") {
    const b = DATA.banks[WQ.sid];
    const q = b.byNum[WQ.list[WQ.i]];
    if (WQ.answers[q.number] != null) return;
    WQ.answers[q.number] = n;
    if (n === q.answer) { delete store.wrong[q.id]; toast("答對了，已從錯題本移除"); }
    else store.wrong[q.id] = { at: Date.now() };
    save();
    const y = window.scrollY; render(); window.scrollTo(0, y);
    const ex = document.getElementById("expl");
    if (ex) setTimeout(() => ex.scrollIntoView({ behavior: "smooth", block: "start" }), 60);
  }
}
function move(d) {
  if (route.name === "quiz") { jump(A.idx + d); }
  else if (route.name === "review") { jump(RV.i + d); }
  else if (route.name === "wrongq") { jump(WQ.i + d); }
}
function jump(i) {
  stopSpeech();
  if (route.name === "quiz") {
    const n = DATA.banks[A.sid].sec[A.sec].length;
    if (i < 0 || i >= n) return;
    A.idx = i; persistA();
  } else if (route.name === "review") {
    if (i < 0 || i >= RV.list.length) return; RV.i = i;
  } else if (route.name === "wrongq") {
    if (i < 0 || i >= WQ.list.length) return; WQ.i = i;
  }
  autoplayPending = true;
  render();
  window.scrollTo(0, 0);
}

/* ===================== boot ===================== */
async function boot() {
  try {
    await loadIndex();
    go({ name: "home" });
  } catch (e) {
    console.error(e);
    $app.innerHTML = '<div class="loading">題庫載入失敗。請確認網路連線後重新整理頁面。</div>';
  }
  try {
    if ("serviceWorker" in navigator && window.isSecureContext && window.top === window.self) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  } catch (e) { /* not available inside the viewer */ }
}
boot();
})();
</script>

</html>
